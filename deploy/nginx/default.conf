# Static site, unprivileged nginx (port 8080, read-only root filesystem;
# the image keeps its pid and temp files in /tmp, an emptyDir in Kubernetes).
server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;  # behind a tunnel/CDN: keep redirects relative

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fingerprinted assets: cache for a year.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/ =404;
    }
}
