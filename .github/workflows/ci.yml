# Every pull request: check, build, leak gate, links, Lighthouse, secret scan.
# Push to main: also build the image once, smoke-test it, scan it, push it to
# GHCR (tag 1.0.<run>), sign it (keyless cosign) and attach an SBOM. The
# platform repo's Renovate picks the new digest up for staging.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  site:
    name: build and check the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run build
      - name: Leak gate (internal details must never reach the site)
        run: npm run leak-gate
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
      - name: Links (internal, offline)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }}/dist 'dist/**/*.html'
          fail: true
      - name: Lighthouse (performance, accessibility, best practices, SEO >= 0.95)
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Secret scan (history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: image (build, test, scan, push, sign)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing (Sigstore)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: site:test
          provenance: false
      - name: Smoke test (health, page, headers, non-root)
        run: |
          docker run -d --name site --read-only --tmpfs /tmp -p 8080:8080 site:test
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/ | grep -q "Ctronix"
          h=$(curl -fsSI localhost:8080/)
          for k in content-security-policy x-content-type-options referrer-policy x-frame-options; do
            grep -qi "^$k:" <<<"$h" || { echo "missing header $k"; exit 1; }
          done
          ! grep -qi "^server: nginx/" <<<"$h"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/no-such-page/)" = 404
          test "$(docker exec site id -u)" != 0
      - name: Vulnerability scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: site:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:1.0.${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign (keyless, bound to this workflow)
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Attest SBOM
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: Summary
        run: |
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}:1.0.${{ github.run_number }}@${{ steps.push.outputs.digest }}\` (signed, SBOM attested)" >> "$GITHUB_STEP_SUMMARY"
